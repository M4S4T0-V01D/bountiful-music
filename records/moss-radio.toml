# Moss Radio: lo-fi hip-hop, 80 bpm, F minor, 57 bars (~2:51). The Song Spec port of bountiful/moss_radio.py:
# it rebuilds the same MIDI note for note (humanize = "legacy": one random stream, drawn in the script's order).
#   $PY -I bountiful/songspec.py records/moss-radio.toml

[meta]
title = "Moss Radio"
genre = "lofi-downtempo"
skeleton = "songs/lofi-downtempo/lofi-downtempo-1346770832.am.json"   # only for the drum grid's bar count
key = "F minor"
scale = ["F", "G", "Ab", "Bb", "C", "Db", "Eb"]
bpm = 80
swing = 0.58
seed = 7
humanize_seed = 80
album = ""
track = 0
year = 2026
tracks = ["keys", "guitar", "flute", "bass", "sub", "pad"]   # the MIDI track order
blurb = """Lo-fi hip-hop at 80 bpm in F minor, composed note by note: a voice-led Dbmaj9 - C7b9 - Fm9 - Ebm9 Ab13 loop on a \
chorused Tine EP, a jazz-guitar theme with an answer phrase, an eight-bar bridge the flute takes on its second pass, an \
upright bass walking into every chord over a sine sub, and a dusty boom-bap kit with a laid-back snare."""

[perform]
humanize = "legacy"
swing = true
loop_from = "section"

[sounds]
allow = ["gs", "dm", "own"]

# ------------------------------------------------------------------ harmony: root and the voiced tones as intervals
[chords]
Dbmaj9 = { root = "Db", intervals = [4, 7, 11, 14] }
C7b9 = { root = "C", intervals = [4, 7, 10, 13] }
Fm9 = { root = "F", intervals = [3, 7, 10, 14] }
Ebm9 = { root = "Eb", intervals = [3, 7, 10, 14] }
Ab13 = { root = "Ab", intervals = [4, 10, 14, 21] }
Bbm9 = { root = "Bb", intervals = [3, 7, 10, 14] }
Eb13 = { root = "Eb", intervals = [4, 10, 14, 21] }
Abmaj9 = { root = "Ab", intervals = [4, 7, 11, 14] }
Gm7b5 = { root = "G", intervals = [0, 3, 6, 10] }
C7sus = { root = "C", intervals = [5, 7, 10, 14] }

[loops]
A = [["Dbmaj9"], ["C7b9"], ["Fm9"], ["Ebm9", "Ab13"]]
B = [["Bbm9"], ["Eb13"], ["Abmaj9"], ["Dbmaj9"], ["Gm7b5"], ["C7b9"], ["Fm9"], ["C7sus", "C7b9"]]
END = [["Fm9"]]

[voicing]   # four chord tones in 50-70, nearest to the last voicing
mode = "lead"
lo = 50
hi = 70
max_span = 14
center = 60
start = [53, 56, 60, 63]

