# ------------------------------------------------------------------ players: who plays what, and how it is humanized
[players.keys]        # the voiced chord, rolled up from the bottom like a hand
type = "chords"
jitter_ms = 6
roll_ms = 14
bottom_vel = -0.03
hold_vel = 0.55
even = [[0, 9, 0.68], [10, 6, 0.52]]     # comp on 1 and a push on the and-of-3
odd = [[0, 13, 0.68], [14, 2, 0.45]]
split = { len = -1, vel = 0.66, step_vel = -0.04 }   # two chords in a bar

[players.pad]         # the keys' voicing without its bottom note, an octave up
type = "chords"
drop_bottom = 1
shift = 12
hold_vel = 0.42
jitter_ms = 0
gap = 0.0

[players.sub_hold]    # the chord root on the sine sub
type = "root"
track = "sub"
octave = 36
vel = 0.7
jitter_ms = 0

[players.bass]
type = "line"
loops = { A = "bass_a", B = "bass_b" }
jitter_ms = 5
gap = 0.02

[players.sub]         # the sine sub doubles every bass note of two steps or more
type = "follow"
follows = "bass"
min_len = 2
jitter_ms = 0
gap = 0.02

[players.guitar]
type = "line"
repeat = false
jitter_ms = 11

[players.flute]
type = "line"
repeat = false
jitter_ms = 8

# ------------------------------------------------------------------ arrangement
[producer]
loop = "A"
parts = ["comp"]

[[sections]]
name = "Intro"
bars = 4
loop = "A"
drums = ["vinyl"]
rootless_ok = true    # keys alone off the record, no bass yet
play = { keys = { mode = "hold", hold_vel = 0.5 } }

[[sections]]
name = "Beat"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "ghost", "hat"]
play = { keys = "comp", bass = true }

[[sections]]
name = "Theme"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "ghost", "hat", "rim"]
crash = true
play = { keys = "comp", bass = true, guitar = "theme" }

[[sections]]
name = "Bridge"
bars = 8
loop = "B"
drums = ["vinyl", "kick", "snare", "clap", "ghost", "hat", "rim", "shaker"]
crash = true
fill = "drop"
play = { keys = "comp", bass = true, guitar = "bridge", pad = true }

[[sections]]
name = "Break"
bars = 4
loop = "A"
drums = ["vinyl", "hat", "rim"]
play = { keys = "hold", sub_hold = true, flute = { part = "theme", bars = "3-4", shift = 12, rest = 2 } }

[[sections]]
name = "Theme again"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "ghost", "hat", "rim"]
crash = true
fill = "drop"
play = { keys = "comp", bass = true, guitar = "theme", pad = true, flute = { part = "theme", bars = "5-8", shift = 12, vel = 0.85, rest = 4 } }

[[sections]]
name = "Bridge, flute"
bars = 8
loop = "B"
drums = ["vinyl", "kick", "snare", "clap", "ghost", "hat", "rim", "shaker"]
crash = true
play = { keys = "comp", bass = true, flute = "bridge", pad = true }

[[sections]]
name = "Outro"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "hat"]
play = { keys = "comp", bass = true, guitar = { part = "theme", bars = "1-4", vel = 0.85 } }

[[sections]]
name = "Last chord"
bars = 1
loop = "END"
drums = ["vinyl"]
ring = 2
play = { keys = "hold" }
notes = { bass = [[[0, 29, 14, 0.8]]], sub = [[[0, 41, 14, 0.75]]], guitar = [[[2, 72, 10, 0.55]]] }

# ------------------------------------------------------------------ drums: boom-bap, snare laid back, swung 16th hats
