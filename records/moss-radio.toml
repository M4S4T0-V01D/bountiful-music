# ------------------------------------------------------------------ mix and master
[mix]
level_ref = "kick"
targets = { keys = -4.0, guitar = -5.0, flute = -8.0, bass = -3.0, sub = -9.0, pad = -15.0 }
test_bars = ["@Theme again", "@Theme again+7"]
mmp_drums = true
lead_hi_follows_lead = false
sends = { echo = { type = "delay", time_beats = 0.75, feedback = 0.35, tone = 2200, taps = 5 } }

[[mix.automation]]   # the record, then the room
type = "lowpass"
tracks = ["keys"]
points = [[1, 650], [4, 1300], [4.75, 2400], [5, 18000]]

[[mix.automation]]
type = "lowpass"
tracks = ["keys", "flute", "hats", "perc"]
points = [["@Break", 18000], ["@Break+0.01", 1700], ["@Break+3.5", 2600], ["@Theme again", 18000]]

[[mix.automation]]
type = "lowpass"
tracks = ["kick", "snare", "hats", "perc", "bass"]
points = [["@Outro+4", 18000], ["@Last chord", 1200]]

[[mix.automation]]
type = "gain"
tracks = ["keys", "guitar", "bass", "sub", "kick", "snare", "hats", "perc", "vinyl"]
points = [["@Outro+4", 0], ["@Last chord", -8], ["@Last chord+2", -40]]

[master]
tape = { drive = 1.4, bias = 0.07, bump_db = 1.2, hf_db = -2.0, lp_hz = 14000, hiss_db = -68, wow_ms = 0.18 }
target_lufs = -14.0
true_peak = -1.0

# ------------------------------------------------------------------ checks, run on the render
[validate]
length_s = [150, 210]
lufs_tolerance = 0.5

[[checks]]
type = "no_drums"
in = "Intro"
except = ["swell"]
name = "intro: keys and crackle only"

[[checks]]
type = "in_harmony"
tracks = ["guitar", "flute"]
max_outside = 2
name = "melody on chord tones or F minor"

[[checks]]
type = "on_chord"
track = "bass"
every_beats = 4
name = "bass on the downbeats is in the chord"

[[checks]]
type = "late"
sound = "snare"
ms = [10, 40]
name = "snare sits behind the beat (10-40 ms)"

[[checks]]
type = "louder"
a = "Theme again"
b = "Break"
db = 2.0
name = "theme returns >= 2 dB over the break"

[[checks]]
type = "count"
track = "keys"
min = 301
name = "keys present"
