# Orange Mound Fog: Memphis rap / phonk instrumental, 70 bpm, G minor, 64 bars (~3:39), made to rap over. The Song Spec
# port of bountiful/orange_mound.py: it rebuilds the same MIDI note for note (humanize = "legacy").
#   $PY -I bountiful/songspec.py records/orange-mound-fog.toml

[meta]
title = "Orange Mound Fog"
genre = "lofi-downtempo"
skeleton = "songs/lofi-downtempo/lofi-downtempo-1346770832.am.json"   # only for the drum grid's bar count
key = "G minor"
scale = ["G", "Ab", "A", "Bb", "C", "D", "Eb", "F", "F#"]   # G minor with the Phrygian b2 and the raised 7th
bpm = 70
swing = 0.5
seed = 7
humanize_seed = 70
album = ""
track = 0
year = 2026
tracks = ["riff", "box", "bell", "choir", "tubular", "boom"]
blurb = """Memphis rap / phonk instrumental at 70 bpm in G minor, made to rap over: an eerie tresillo piano riff over \
Gm - Ab - Eb - D7b9, a pitched 808 cowbell hook, a choir, and a tuned, sliding 808 bass under a crunchy TR-808 kit \
with rolling hats. Verses leave room for the vocal and drop the beat into every hook."""

[perform]
humanize = "legacy"
swing = false
loop_from = "song"     # the 4-bar loop runs from bar 1, whatever the section

[sounds]
allow = ["gs", "dm", "own"]

# ------------------------------------------------------------------ harmony
[chords]
Gm = { root = "G", intervals = [0, 3, 7] }
Ab = { root = "Ab", intervals = [0, 4, 7] }
Eb = { root = "Eb", intervals = [0, 4, 7] }
D7b9 = { root = "D", intervals = [0, 4, 7, 10, 13] }

[loops]
A = [["Gm"], ["Gm", "Ab"], ["Eb"], ["D7b9"]]

[voicing]   # each chord tone in 55-72, up to four of them (the choir)
mode = "near"
lo = 55
hi = 72
tones = 4

# ------------------------------------------------------------------ written parts: per bar [step16, pitch, length16, vel]
[parts]
riff = [   # the tresillo (3-3-2) piano riff
  [[0, 67, 3, 0.8], [3, 74, 3, 0.7], [6, 70, 2, 0.65], [8, 67, 3, 0.75], [11, 74, 3, 0.65], [14, 75, 2, 0.6]],
  [[0, 74, 3, 0.75], [3, 70, 3, 0.65], [6, 67, 2, 0.6], [8, 68, 3, 0.8], [11, 72, 3, 0.65], [14, 75, 2, 0.6]],
  [[0, 70, 3, 0.75], [3, 75, 3, 0.7], [6, 67, 2, 0.6], [8, 70, 3, 0.7], [11, 79, 3, 0.7], [14, 75, 2, 0.6]],
  [[0, 66, 3, 0.8], [3, 72, 3, 0.7], [6, 75, 2, 0.65], [8, 74, 3, 0.75], [11, 66, 3, 0.65], [14, 69, 2, 0.6]],
]
bell = [   # the cowbell hook
  [[0, 79, 2, 0.9], [3, 79, 1, 0.6], [4, 82, 2, 0.8], [6, 79, 2, 0.7], [8, 86, 3, 0.9], [11, 84, 2, 0.7], [13, 82, 1, 0.6], [14, 79, 2, 0.7]],
  [[0, 77, 2, 0.8], [3, 79, 1, 0.6], [4, 80, 4, 0.85], [8, 84, 2, 0.8], [10, 80, 2, 0.7], [12, 79, 4, 0.75]],
  [[0, 82, 2, 0.9], [3, 82, 1, 0.6], [4, 87, 2, 0.8], [6, 82, 2, 0.7], [8, 86, 3, 0.85], [11, 84, 2, 0.7], [13, 82, 1, 0.6], [14, 79, 2, 0.7]],
  [[0, 78, 3, 0.9], [3, 81, 3, 0.75], [6, 84, 2, 0.8], [8, 87, 4, 0.85], [12, 86, 4, 0.8]],
]
b808 = [   # a fifth field "s" slides into the next note
  [[0, 31, 7, 1.0], [7, 31, 3, 0.85], [10, 31, 4, 0.9, "s"], [14, 43, 2, 0.75]],
  [[0, 31, 6, 1.0], [6, 31, 2, 0.8], [8, 32, 6, 0.95, "s"], [14, 34, 2, 0.8]],
  [[0, 39, 7, 1.0], [7, 39, 3, 0.8], [10, 34, 4, 0.85], [14, 39, 2, 0.75]],
  [[0, 38, 6, 1.0], [6, 38, 2, 0.8], [8, 38, 4, 0.9, "s"], [12, 42, 2, 0.8, "s"], [14, 38, 2, 0.7]],
]
pocket808 = [   # the last verse bar: one long D under the drop
  [[0, 38, 12, 1.0]],
]

# ------------------------------------------------------------------ players
[players.choir]
type = "chords"
hold_vel = 0.5
jitter_ms = 0
gap = 0.0

[players.riff]
type = "line"
part = "riff"
jitter_ms = 6

[players.box]         # the music box doubles the riff an octave up
type = "line"
part = "riff"
shift = 12
vel = 0.8
jitter_ms = 3

[players.bell]
type = "line"
part = "bell"
jitter_ms = 3

[players.tubular]     # one far-off bell every 8 bars
type = "every"
bars = 8
offset = 4
note = [0, 74, 16, 0.5]
jitter_ms = 0

[players.boom]        # the tuned 808
type = "line"
part = "b808"
jitter_ms = 0
gap = 0.08
tie_gap = 0.0
sort = true

# ------------------------------------------------------------------ arrangement
[producer]
loop = "A"
parts = ["comp"]

[[sections]]
name = "Intro"
bars = 4
loop = "A"
drums = ["vinyl"]
crash = false
play = { riff = 0.8, choir = { mode = "hold", hold_vel = 0.42 } }

[[sections]]
name = "Hook 1"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "hat", "open", "perc"]
crash = true
play = { riff = 1.0, box = true, bell = true, choir = "hold", boom = true }

[[sections]]
name = "Verse 1"
bars = 16
loop = "A"
drums = ["vinyl", "kick", "snare_v", "clap_v", "hat"]
crash = false
fill = "drop"
play = { riff = 0.7, tubular = true, boom = { part = "b808", last = "pocket808" } }

[[sections]]
name = "Hook 2"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "hat", "open", "perc"]
crash = true
play = { riff = 1.0, box = true, bell = true, choir = "hold", boom = true }

[[sections]]
name = "Verse 2 open"   # 808 and hats only
bars = 2
loop = "A"
drums = ["vinyl", "hat3"]
crash = false
play = { riff = 0.7, boom = true }

[[sections]]
name = "Verse 2"
bars = 14
loop = "A"
drums = ["vinyl", "kick", "snare_v", "clap_v", "hat3"]
crash = false
fill = "drop"
play = { riff = 0.7, tubular = true, boom = { part = "b808", last = "pocket808" } }

[[sections]]
name = "Hook 3"
bars = 8
loop = "A"
drums = ["vinyl", "kick", "snare", "clap", "hat", "open", "perc"]
crash = true
play = { riff = 1.0, box = true, bell = true, choir = "hold", boom = true }

[[sections]]
name = "Outro"
bars = 4
loop = "A"
drums = ["vinyl"]
crash = false
play = { riff = 0.75, choir = "hold", boom = { part = "b808", for = 2 } }

# ------------------------------------------------------------------ drums: a crunchy TR-808, kick on the 808's hits
[drums]
humanize_ms = 4

[drums.kit]
kick = { sound = "dm:tr808/kick", bus = "kick" }
snare = { sound = "dm:tr808/snare", bus = "snare" }
clap = { sound = "dm:tr808/handclap", bus = "snare", gain_db = -2 }
hat = { sound = "dm:tr808/hat_c", bus = "hats" }
open = { sound = "dm:tr808/hat_o", bus = "hats", gain_db = -6, lp = 9000 }
clave = { sound = "dm:tr808/clave", bus = "perc" }
crash = { sound = "dm:tr808/ride", bus = "hats", gain_db = -6, lp = 8000 }
swell = { sound = "own:vinyl-crackle-70", bus = "vinyl", detune_cents = 0 }

[drums.buses]
kick = { hp = 45, mono = true, drive = 1.6, eq = [["peak", 3500, 2.0, 1.0]], gain_db = -4.0 }
snare = { hp = 160, lp = 9000, drive = 1.5, crush = { bits = 10, rate = 22050, mix = 0.45 }, sends = { room = 0.2 }, gain_db = 4.0 }
hats = { pan = 0.12, hp = 400, lp = 10000, crush = { bits = 12, rate = 26040, mix = 0.35 }, gain_db = 14.0 }
perc = { pan = -0.35, crush = { bits = 10, rate = 22050, mix = 0.45 }, sends = { echo = 0.25 }, gain_db = 10.0 }
vinyl = { hp = 500, lp = 8000, gain_db = 0.0 }

