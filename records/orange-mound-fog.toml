# ------------------------------------------------------------------ voices
[voices.riff]
sound = "gs:0:0"
label = "Grand Piano"
fx = { hp = 180, lp = 6000, eq = [["peak", 300, -2.0, 1.0]], crush = { bits = 12, rate = 26040, mix = 0.4 }, drive = 1.2, wow = { depth_ms = 1.4, rate = 0.5, flutter_ms = 0.15 }, sends = { room = 0.25, plate = 0.15 }, width = 0.8, gain_db = 0.0 }

[voices.box]
sound = "gs:0:10"
label = "Music Box"
fx = { hp = 500, lp = 8000, crush = { bits = 12, rate = 26040, mix = 0.4 }, wow = { depth_ms = 1.4, rate = 0.5, flutter_ms = 0.15 }, pan = 0.25, sends = { plate = 0.3, echo = 0.15 }, gain_db = 0.0 }

[voices.bell]         # the 808 cowbell, retuned so its lower partial sits on the note
sound = "own:cowbell-808-tuned"
label = "TR-808 cowbell, tuned and pitched"
root = 73
vol = 100
fx = { hp = 350, drive = 1.6, crush = { bits = 12, rate = 26040, mix = 0.3 }, sends = { echo = 0.18, plate = 0.12 }, width = 1.0, gain_db = 0.0 }

[voices.choir]
sound = "gs:0:52"
label = "Choir Aahs"
fx = { hp = 220, lp = 4500, width = 0.9, wow = { depth_ms = 1.4, rate = 0.5, flutter_ms = 0.15 }, sends = { plate = 0.4 }, gain_db = 0.0 }

[voices.tubular]      # verses only, so no level target: set by hand
sound = "gs:0:14"
label = "Tubular Bells"
fx = { hp = 300, lp = 6000, pan = -0.3, crush = { bits = 12, rate = 26040, mix = 0.4 }, sends = { plate = 0.45, echo = 0.3 }, gain_db = -17.0 }

[voices.boom]         # the tuned TR-808 bass drum, sliding between tied notes
sound = "engine:pyvoice"
[voices.boom.engine]
kind = "pyvoice"
glide_gap = 0.04
preset = { module = "tr808", fn = "note", label = "Tuned TR-808 bass drum with slides (bountiful/tr808_voice.py)", decay = 1.4, drive = 2.8, dist_mix = 0.6, glide = 0.08 }
hp = 25
lp = 4000
mono = true
gain_db = 0.0

# ------------------------------------------------------------------ mix and master
[mix]
level_ref = "kick"
targets = { boom = 3.0, riff = -5.0, box = -11.0, bell = -6.0, choir = -13.0 }
test_bars = ["@Hook 2", "@Hook 2+7"]
mmp_drums = true
lead_hi_follows_lead = false
sends = { echo = { type = "delay", time_beats = 0.75, feedback = 0.4, tone = 2000, taps = 5 } }

[[mix.automation]]   # the intro opens up
type = "lowpass"
tracks = ["riff", "choir"]
points = [[1, 500], [3, 900], [4.5, 1800], [5, 18000]]

[[mix.automation]]   # each verse (both blocks of verse 2): the riff low-passed, out of the vocal's way
type = "lowpass"
tracks = ["riff"]
points = [["@Verse 1", 18000], ["@Verse 1+0.01", 2400], ["@Hook 2-0.01", 2400], ["@Hook 2", 18000]]

[[mix.automation]]
type = "lowpass"
tracks = ["riff"]
points = [["@Verse 2 open", 18000], ["@Verse 2 open+0.01", 2400], ["@Hook 3-0.01", 2400], ["@Hook 3", 18000]]

[[mix.automation]]
type = "lowpass"
tracks = ["riff", "choir", "boom"]
points = [["@Outro", 18000], ["@Outro+4", 700]]

[[mix.automation]]
type = "gain"
tracks = ["riff", "choir", "boom", "vinyl"]
points = [["@Outro+2", 0], ["@Outro+3", -10], ["@Outro+4.5", -40]]

[master]
tape = { drive = 1.6, bias = 0.06, bump_db = 1.0, hf_db = -1.5, lp_hz = 13000, hiss_db = -62, wow_ms = 0.15 }
target_lufs = -10.0
true_peak = -1.0
mono_below = 120

# ------------------------------------------------------------------ checks, run on the render
[validate]
length_s = [180, 240]
lufs_tolerance = 0.7

[[checks]]
type = "no_drums"
in = "Intro"
except = ["swell"]
name = "intro: no drums"

[[checks]]
type = "absent"
track = "bell"
in = ["Verse 1", "Verse 2 open", "Verse 2"]
name = "no cowbell lead in the verses"

[[checks]]
type = "stops"
in = ["Verse 1", "Verse 2"]
after_beat = 3
except = ["swell"]
name = "verse pockets: beat stops after beat 3 of each verse's last bar"

[[checks]]
type = "in_harmony"
tracks = ["bell", "riff"]
name = "riff and hook in G (harmonic) minor"

[[checks]]
type = "on_chord"
track = "boom"
every_beats = 2
window_beats = 0.05
name = "808 on beats 1 and 3 is a chord tone"

[[checks]]
type = "bands"
in = "Hook 2"
a = [20, 120]
b = [120, 8000]
db = 2.0
name = "bass heavy: energy < 120 Hz above 120 Hz-8 kHz (hook 2)"

[[checks]]
type = "band_drop"
a = "Hook 2"
b = "Verse 1"
bars = [8, 15]        # verse 1 without its pocket bar
band = [1000, 4000]
db = 3.0
name = "room for vocals: verse 1-4 kHz >= 3 dB under the hook"
