# Build the Linux AppImage, the Windows installer and the macOS disk image, test each one, and attach them to the
# release when a version tag (vX.Y.Z) is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: build/appimage/AppDir/usr/python/bin/python3
          - os: windows-latest
            py: build/bundle/Bountiful/python/python.exe
          - os: macos-latest
            py: build/bundle/Bountiful.app/Contents/Resources/python/bin/python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
      APPIMAGE_EXTRACT_AND_RUN: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version

      - uses: astral-sh/setup-uv@v6

      - name: programs the app uses
        run: |
          case "$RUNNER_OS" in
            Linux) export DEBIAN_FRONTEND=noninteractive
                   timeout 600 sudo -E apt-get update -qq
                   timeout 900 sudo -E apt-get install -y -qq --no-install-recommends fluidsynth libportaudio2 libxcb-cursor0 libegl1 libgl1 libxkbcommon0 libfontconfig1 ;;
            macOS) brew install fluidsynth ;;
            Windows)
              mkdir -p "$RUNNER_TEMP/fluidsynth"
              gh release download --repo FluidSynth/fluidsynth --pattern '*win10-x64*.zip' --dir "$RUNNER_TEMP/fs-zip"
              unzip -q "$(ls "$RUNNER_TEMP"/fs-zip/*.zip | head -n1)" -d "$RUNNER_TEMP/fluidsynth"
              dirname "$(find "$RUNNER_TEMP/fluidsynth" -name fluidsynth.exe | head -n1)" >> "$GITHUB_PATH"
              [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress ;;
          esac

      - name: build
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash scripts/appimage.sh
          else uv run --no-project --python 3.13 scripts/bundle.py; fi

      - name: the starter pack (tests and the smoke test need its sounds)
        run: |
          gh release download packs-v1 --repo "$GITHUB_REPOSITORY" --pattern bountiful-starter.tar.gz --dir "$RUNNER_TEMP/packs"
          case "$RUNNER_OS" in
            Linux)   APP=build/appimage/AppDir/usr/app ;;
            Windows) APP=build/bundle/Bountiful/app ;;
            macOS)   APP=build/bundle/Bountiful.app/Contents/Resources/app ;;
          esac
          "${{ matrix.py }}" "$APP/bountiful/packs.py" install starter --from "$RUNNER_TEMP/packs/bountiful-starter.tar.gz"
          "${{ matrix.py }}" "$APP/bountiful/setup_check.py" || true

      - name: tests (with the bundled Python)
        timeout-minutes: 15
        run: |
          for t in setup packs songspec record_desk native; do "${{ matrix.py }}" -I tests/test_$t.py; done
          "${{ matrix.py }}" tests/test_updater.py
          "${{ matrix.py }}" tests/test_app.py

      - name: smoke test of the bundle
        timeout-minutes: 5
        run: |
          case "$RUNNER_OS" in
            Linux)   APP=build/appimage/AppDir/usr/app ;;
            Windows) APP=build/bundle/Bountiful/app ;;
            macOS)   APP=build/bundle/Bountiful.app/Contents/Resources/app ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then dist/Bountiful-*-x86_64.AppImage --smoke
          elif [ "$RUNNER_OS" = macOS ]; then build/bundle/Bountiful.app/Contents/MacOS/Bountiful --smoke
          else "${{ matrix.py }}" -E -s "$APP/bountiful/daw/main.py" --smoke; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bountiful-${{ runner.os }}
          path: |
            dist/Bountiful-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach to the release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Bountiful ${TAG#v}" --generate-notes
          have="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in dist/*; do
            grep -qxF "$(basename "$f")" <<<"$have" && { echo "already there: $(basename "$f")"; continue; }
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done
