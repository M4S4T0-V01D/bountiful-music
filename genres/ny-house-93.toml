name = "NY House '93"
description = "Early-90s New York house in the David Morales tradition: four-on-the-floor, swung hats, congas and timbales, piano stabs on a 3-3-4-3-3 rhythm, deep octave bass, strings, a poly-synth hook. 124 bpm, mostly minor."
bpm = 124
kit = "house"
drums = "house"
swing = 0.54

[composer]
tempoRange = [124, 124]
useNaturalTempoChanges = false
adaptTempoToRenderAmount = false
endSongTempoChangeProbability = 0
timeSignature2Likelihood = 0
timeSignature3Likelihood = 0
minorScaleLikelihood = 4
modulateLikelihoodMultiplier = 0.05
electronicLikelihood = 3
acousticLikelihood = 0
songIntroProbability = 1
buildSongStructureLikelihoodMultiplier = 3

[harmony]
rhythm = 1
dominant = "keep"
colors = { m = "m9", "" = "maj7", m7 = "m9", "7" = "9" }

[melody]
register = [62, 81]
max_leap = 7
max_notes_per_bar = 6
articulation = "legato"
humanize_ms = 6
push_ms = -3
velocity = [0.62, 0.92]

[bass]
style = "pattern"
register = [33, 52]
pattern = [[0, "R", 0.6], [3, "R", 0.2], [6, "O", 0.4], [10, "R", 0.4], [14, "5-", 0.3]]
humanize_ms = 2

[pad]
low = 55
high = 76
top = 72
notes = 4
vel = 0.5

[comp]          # piano stabs
steps = [0, 3, 6, 10, 13]
low = 56
high = 74
top = 72
notes = 4
gate = 0.22
humanize_ms = 4

[[arrangement]]
name = "Intro: kick and hats"
loop = "A"
bars = 8
drums = ["kick", "hat"]
[[arrangement]]
name = "Intro: full kit"
loop = "A"
bars = 8
drums = ["kick", "hat", "open", "shaker", "clap"]
fill = "toms"
[[arrangement]]
name = "Bass in"
loop = "A"
bars = 16
parts = ["bass"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas"]
fill = "toms"
[[arrangement]]
name = "Verse"
loop = "V"
bars = 16
parts = ["bass", "comp", "lead"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas"]
fill = "toms"
[[arrangement]]
name = "Chorus"
loop = "A"
bars = 16
parts = ["bass", "comp", "pad", "lead"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas"]
crash = true
fill = "snare_roll"
[[arrangement]]
name = "Lift"
loop = "B"
bars = 16
parts = ["bass", "comp", "pad", "lead"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas"]
crash = true
fill = "toms"
[[arrangement]]
name = "Breakdown"
loop = "A"
bars = 8
parts = ["pad", "lead"]
[[arrangement]]
name = "Build"
loop = "A"
bars = 8
parts = ["pad", "comp"]
drums = ["hat", "shaker", "congas"]
fill = "roll16"
[[arrangement]]
name = "Peak"
loop = "A"
bars = 32
parts = ["bass", "comp", "pad", "lead"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas", "timbales"]
crash = true
fill = "toms"
[[arrangement]]
name = "Lift 2"
loop = "B"
bars = 16
parts = ["bass", "comp", "pad", "lead"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas", "timbales"]
crash = true
fill = "snare_roll"
[[arrangement]]
name = "Outro: melody out"
loop = "A"
bars = 16
parts = ["bass", "comp", "pad"]
drums = ["kick", "clap", "hat", "open", "shaker", "congas"]
[[arrangement]]
name = "Outro: drums"
loop = "A"
bars = 16
parts = []
drums = ["kick", "clap", "hat", "open"]

[sounds.lead]
kind = "polylead"
preset = "lead-poly.json"
hp = 220
chorus = { depth_ms = 2.5, rate = 0.5, base_ms = 10, mix = 0.3 }
sends = { echo = 0.14, plate = 0.2 }
width = 1.4
gain_db = -11.0
[sounds.comp]
kind = "sampler"
preset = { sample = "instruments/piano02.ogg", root = 48, release = 0.18 }
hp = 150
eq = [["peak", 300, -3.0, 1.0], ["peak", 2800, 2.5, 0.8]]
drive = 1.2
chorus = { depth_ms = 1.8, rate = 0.4, base_ms = 9, mix = 0.25 }
width = 1.5
sends = { room = 0.2, plate = 0.08 }
duck = { depth = 0.15, release = 0.12 }
gain_db = -7.0
[sounds.pad]
kind = "pad"
preset = "pad-keys.json"
hp = 220
lp = 5000
chorus = { depth_ms = 3.0, rate = 0.35, base_ms = 11, mix = 0.4 }
width = 1.6
sends = { plate = 0.35 }
duck = { depth = 0.25, release = 0.15 }
gain_db = -21.0
[sounds.bass]
kind = "analogbass"
preset = "bass-round.json"
hp = 32
lp = 2800
mono = true
duck = { depth = 0.35, release = 0.11 }
gain_db = -7.0

# Experimental synthesis (off unless this says enabled = true or you build with --experimental):
# the organ stab becomes a struck material, the pad a phase garden, the bass a slack string.
[experimental_synthesis]
enabled = false

[experimental_synthesis.tracks.comp]
engine = "material"
preset = "practice-room-piano"
gain_db = -12.0

[experimental_synthesis.tracks.pad]
engine = "phase_garden"
preset = "drift-choir"
gain_db = -17.0

[experimental_synthesis.tracks.bass]
engine = "gravity"
preset = "slack-bass"
gain_db = -9.0
