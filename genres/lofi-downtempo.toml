name = "Lo-fi Downtempo"
description = "Late-night lo-fi / downtempo hip-hop: lazy swung boom-bap, dusty Rhodes comping with a slight strum, jazzy 7th and 9th chords, a walking bass, a soft melody with space. 86 bpm."
bpm = 86
kit = "dusty"
drums = "boombap"
swing = 0.6

[composer]
tempoRange = [86, 86]
useNaturalTempoChanges = false
adaptTempoToRenderAmount = false
endSongTempoChangeProbability = 0
timeSignature2Likelihood = 0
timeSignature3Likelihood = 0
modulateLikelihoodMultiplier = 0.1
electricLikelihood = 2
acousticLikelihood = 1
songIntroProbability = 1
melodyMotifRythmCountIncreasePerIndex = 0.2

[harmony]
rhythm = 1
dominant = "keep"
colors = { m = "m9", "" = "maj9", m7 = "m9", "7" = "9", maj7 = "maj9" }

[melody]
register = [62, 81]
max_leap = 7
max_notes_per_bar = 5
articulation = "detached"
humanize_ms = 14
push_ms = 6
swing = 0.6
velocity = [0.5, 0.8]

[bass]
style = "walking"
register = [33, 52]
humanize_ms = 10
swing = 0.6

[pad]
low = 55
high = 76
top = 72
notes = 4
vel = 0.4

[comp]
steps = [0, 7, 10]
low = 55
high = 74
top = 71
notes = 4
gate = 0.9
strum_ms = 22
humanize_ms = 12
swing = 0.6

[[arrangement]]
name = "Intro: keys"
loop = "A"
bars = 4
parts = ["comp"]
[[arrangement]]
name = "Beat in"
loop = "A"
bars = 8
parts = ["comp", "bass"]
drums = ["kick", "snare", "hat"]
[[arrangement]]
name = "Melody"
loop = "A"
bars = 16
parts = ["comp", "bass", "lead"]
drums = ["kick", "snare", "hat", "rim"]
[[arrangement]]
name = "B section"
loop = "V"
bars = 8
parts = ["comp", "bass", "pad", "lead"]
drums = ["kick", "snare", "hat"]
[[arrangement]]
name = "Breather"
loop = "B"
bars = 8
parts = ["comp", "pad"]
drums = ["hat"]
[[arrangement]]
name = "Melody returns"
loop = "A"
bars = 16
parts = ["comp", "bass", "lead", "pad"]
drums = ["kick", "snare", "hat", "rim"]
[[arrangement]]
name = "Outro"
loop = "A"
bars = 8
parts = ["comp", "bass"]
drums = ["kick", "snare", "hat"]

[sounds.lead]
kind = "vibes"
preset = "vibes-motor.json"
hp = 250
lp = 6000
sends = { plate = 0.25, echo = 0.12 }
gain_db = -12.0
[sounds.comp]
kind = "rhodes"
preset = "rhodes-dusty.json"
hp = 120
lp = 6000
chorus = { depth_ms = 2.0, rate = 0.6, base_ms = 9, mix = 0.3 }
width = 1.3
sends = { room = 0.2 }
gain_db = -10.0
[sounds.pad]
kind = "pad"
preset = "pad-night.json"
hp = 200
lp = 3000
width = 1.5
sends = { plate = 0.3 }
gain_db = -22.0
[sounds.bass]
kind = "bass"
preset = "bass-upright.json"
hp = 35
lp = 2500
mono = true
gain_db = -6.0
[master]
tape = { drive = 1.5, bias = 0.06, bump_db = 1.2, hf_db = -3.0, lp_hz = 13000, hiss_db = -72, wow_ms = 0.12 }
