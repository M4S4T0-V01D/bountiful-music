name = "Italo Disco '84"
description = "Mid-80s Italo disco: four-on-the-floor LinnDrum-style kit with claps, galloping octave bass, bright arpeggios, a singing poly-synth lead, lush strings. 120 bpm, minor or major."
bpm = 120
kit = "linn"
drums = "italo"
swing = 0.5

[composer]
tempoRange = [120, 120]
useNaturalTempoChanges = false
adaptTempoToRenderAmount = false
endSongTempoChangeProbability = 0
timeSignature2Likelihood = 0
timeSignature3Likelihood = 0
minorScaleLikelihood = 3
majorScaleLikelihood = 1
modulateLikelihoodMultiplier = 0.1
electronicLikelihood = 1
acousticLikelihood = 0
songIntroProbability = 1
verseChorusSongStructureLikelihoodMultiplier = 4

[harmony]
rhythm = 1
dominant = "keep"
colors = { m7 = "m7", maj7 = "maj7", "" = "", m = "m" }

[melody]
register = [62, 82]
max_leap = 7
max_notes_per_bar = 7
articulation = "legato"
humanize_ms = 4
velocity = [0.66, 0.94]

[bass]
style = "octave8"
register = [33, 50]
gate = 0.3

[pad]
low = 57
high = 79
top = 74
notes = 4
vel = 0.52

[arp]
pattern = [0, 1, 2, 3, 4, 3, 2, 1]
low = 64
high = 86
gate = 0.14
rate = 0.25

[[arrangement]]
name = "Intro: drums + bass"
loop = "A"
bars = 8
parts = ["bass"]
drums = ["kick", "hat", "open"]
[[arrangement]]
name = "Intro: arpeggio"
loop = "A"
bars = 8
parts = ["bass", "arp"]
drums = ["kick", "clap", "hat", "open"]
fill = "syntoms"
[[arrangement]]
name = "Verse"
loop = "V"
bars = 16
parts = ["bass", "lead", "pad"]
drums = ["kick", "clap", "hat", "open"]
fill = "syntoms"
[[arrangement]]
name = "Chorus"
loop = "A"
bars = 16
parts = ["bass", "lead", "arp", "pad"]
drums = ["kick", "clap", "hat", "open", "shaker"]
crash = true
fill = "syntoms"
[[arrangement]]
name = "Verse 2"
loop = "V"
bars = 16
parts = ["bass", "lead", "arp", "pad"]
drums = ["kick", "clap", "hat", "open"]
fill = "syntoms"
[[arrangement]]
name = "Chorus 2"
loop = "A"
bars = 16
parts = ["bass", "lead", "arp", "pad"]
drums = ["kick", "clap", "hat", "open", "shaker"]
crash = true
fill = "snare_roll"
[[arrangement]]
name = "Instrumental"
loop = "B"
bars = 16
parts = ["bass", "arp", "pad", "lead"]
drums = ["kick", "clap", "hat", "open"]
fill = "syntoms"
[[arrangement]]
name = "Last chorus"
loop = "A"
bars = 16
parts = ["bass", "lead", "lead_hi", "arp", "pad"]
drums = ["kick", "clap", "hat", "open", "shaker"]
crash = true
[[arrangement]]
name = "Outro"
loop = "A"
bars = 8
parts = ["bass", "arp"]
drums = ["kick", "clap", "hat", "open"]

[sounds.lead]
kind = "polylead"
preset = "lead-poly.json"
hp = 220
chorus = { depth_ms = 3.0, rate = 0.5, base_ms = 10, mix = 0.35 }
sends = { echo = 0.18, plate = 0.25 }
width = 1.3
gain_db = -9.0
[sounds.arp]
kind = "polylead"
preset = "seq-pluck.json"
hp = 300
chorus = { depth_ms = 2.5, rate = 0.4, base_ms = 10, mix = 0.35 }
width = 1.5
sends = { echo = 0.2 }
gain_db = -11.0
[sounds.pad]
kind = "pad"
preset = "formanta-strings.json"
hp = 220
lp = 7000
chorus = { depth_ms = 4.0, rate = 0.5, base_ms = 12, mix = 0.5 }
width = 1.7
sends = { plate = 0.35 }
gain_db = -18.0
[sounds.bass]
kind = "analogbass"
preset = "bass-round.json"
hp = 35
lp = 3500
mono = true
duck = { depth = 0.25, release = 0.1 }
gain_db = -8.0
